<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SPS Condition Assessment</title>
    <meta
      name="description"
      content="Capture a sewerage pump station condition assessment on site and export the completed Unitywater report."
    />

    <!-- Add to Home Screen on iOS: full screen, no Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SPS Assess" />
    <meta name="theme-color" content="#0b3ba8" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" href="icon-180.png" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="topbar">
      <button
        id="back"
        class="iconbtn hidden"
        type="button"
        aria-label="Back to all stations"
      >
        ‹
      </button>
      <h1 id="title">
        SPS assessments
        <span class="sub" id="subtitle">Loading…</span>
      </h1>
      <button id="topaction" class="iconbtn primary hidden" type="button">
        Report
      </button>
    </header>

    <nav class="sectionbar hidden" id="sectionbar" aria-label="Report sections"></nav>

    <main id="app"></main>

    <div id="toast" role="status" aria-live="polite"></div>

    <!-- A hidden pair of pickers, reused by every photo button. iOS treats
         `capture` and `multiple` as mutually exclusive, so straight-to-camera
         and pick-from-library have to be separate inputs. -->
    <input
      id="camera"
      class="visually-hidden"
      type="file"
      accept="image/*"
      capture="environment"
    />
    <input
      id="library"
      class="visually-hidden"
      type="file"
      accept="image/*"
      multiple
    />

    <script src="schema.js"></script>
    <script src="docx.js"></script>
    <script src="app.js"></script>
  </body>
</html>
